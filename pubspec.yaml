name: kerteriz
description: Fitbit Air verisini Health Connect uzerinden okuyup bilesik metriklere ceviren kisisel saglik uygulamasi.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  health: ^13.3.2
  # flutter_localizations intl surumunu kesin olarak sabitler;
  # caret koymak SDK yukseldiginde "version solving failed" uretir.
  intl: any
  path_provider: ^2.1.4
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
